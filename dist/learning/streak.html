<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf6fa">
<title>Lumi English — Streak &amp; Stats</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">
  <div class="page-head">
    <button class="back-btn" data-link="index.html" aria-label="Back to home">←</button>
    <h1 class="page-title">Keep Your Streak Alive 🔥</h1>
  </div>

  <section class="streak-hero" id="streakHero"></section>
  <section class="stat-grid" id="stats"></section>

  <section class="section">
    <div class="section-head">
      <h2 class="section-title">Weekly activity</h2>
      <span class="section-sub">This week</span>
    </div>
    <div class="card">
      <div class="week" id="week"></div>
      <p class="empty-hint" id="weekHint"></p>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 class="section-title">Streak calendar</h2>
      <span class="section-sub" id="calMonth"></span>
    </div>
    <div class="card">
      <div class="cal-grid" id="calendar"></div>
      <p class="empty-hint" id="calHint"></p>
      <div class="cal-legend">
        <span><i class="swatch learned"></i>Learned</span>
        <span><i class="swatch missed"></i>Missed</span>
        <span><i class="swatch today"></i>Today</span>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 class="section-title">Course progress</h2>
      <span class="section-sub">All skills</span>
    </div>
    <div class="card" id="skillProgress"></div>
  </section>

  <section class="section">
    <div class="motivate" id="motivation"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 class="section-title">Achievements</h2>
      <span class="section-sub">Earned by real progress</span>
    </div>
    <div class="ach-grid" id="achBoxStreak"></div>
    <button class="btn btn-ghost" data-link="index.html" style="margin-top:16px">← Back to Learning Path</button>
  </section>
</main>

<nav class="bottom-nav" aria-label="Main navigation">
  <button class="nav-item" data-nav="index.html"><span class="nav-ico">🏠</span><span class="nav-lbl">Home</span></button>
  <button class="nav-item" data-nav="streak.html"><span class="nav-ico">🔥</span><span class="nav-lbl">Streak</span></button>
  <button class="nav-item" data-nav="profile.html"><span class="nav-ico">👤</span><span class="nav-lbl">Profile</span></button>
</nav>

<script src="mascots.js"></script>
<script src="data/vocabulary.js"></script>
<script src="data/grammar.js"></script>
<script src="data/reading.js"></script>
<script src="data/course.js"></script>
<script src="js/state.js"></script>
<script src="js/engine.js"></script>
<script src="js/lesson.js"></script>
<script src="js/app.js"></script>
<script src="js/home.js"></script>
<script src="js/streak.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
